name: Desktop

on:
  pull_request:
    paths:
      - "desktop-app/**"
      - "!desktop-app/**/*.md"
      - "examples/**"
      - "docs/downloads/**"
      - ".node-version"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/dependency-audit.yml"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: ./.github/workflows/dependency-audit.yml
  desktop:
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: rustup default stable
      - name: Identify the Rust toolchain
        id: rust
        shell: bash
        run: echo "version=$(rustc -V | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop-app/src-tauri/target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('desktop-app/src-tauri/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-
      - name: macOS basic checks
        if: runner.os == 'macOS'
        run: |
          ./desktop-app/scripts/check.sh
          cargo clippy --locked --manifest-path desktop-app/src-tauri/Cargo.toml --lib -- -D warnings
        env:
          MATHLIDELUX_COMPILER_TESTS: "0"
      - name: Windows basic checks
        if: runner.os == 'Windows'
        shell: powershell
        run: ./desktop-app/scripts/check-windows.ps1 -SkipCompilers
      - name: Save dependencies even when a later test fails
        if: always() && !cancelled() && steps.rust-cache.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop-app/src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
