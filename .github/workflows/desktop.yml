name: Desktop

on:
  pull_request:
    paths: ['desktop-app/**', '.github/workflows/desktop.yml', 'LICENSE', 'NOTICE']
  push:
    branches: [main]
    paths: ['desktop-app/**', '.github/workflows/desktop.yml', 'LICENSE', 'NOTICE']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: rustup default stable
      - run: ./desktop-app/scripts/check.sh
        env:
          # Real TeX/Typst checks remain required locally before a release.
          MATHLIDELUX_COMPILER_TESTS: '0'
      - run: cargo clippy --manifest-path desktop-app/src-tauri/Cargo.toml --lib -- -D warnings
