name: Ubuntu experimental

on:
  pull_request:
    paths:
      - "desktop-app/**"
      - ".github/workflows/ubuntu.yml"
      - "scripts/apt-repository.py"
  push:
    branches: [main]
    paths:
      - "desktop-app/**"
      - ".github/workflows/ubuntu.yml"
      - "scripts/apt-repository.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop-app/src-tauri/target
          key: ubuntu-24-rust-${{ hashFiles('desktop-app/src-tauri/Cargo.lock') }}
      - name: Install build and rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            librsvg2-dev libayatana-appindicator3-dev patchelf \
            latexmk texlive-latex-extra texlive-extra-utils texlive-pictures \
            ghostscript pdf2svg poppler-utils lmodern cm-super-minimal
          curl -fL --retry 3 -o "$RUNNER_TEMP/typst.tar.xz" \
            https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  $RUNNER_TEMP/typst.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - run: npm --prefix desktop-app ci
      - run: npm --prefix desktop-app test
      - name: Build Debian package
        run: bash desktop-app/scripts/build-ubuntu.sh
      - name: Rust tests
        run: cargo test --release --manifest-path desktop-app/src-tauri/Cargo.toml --lib
      - name: Real LaTeX, Typst, TikZ and CeTZ checks
        run: cargo run --release --manifest-path desktop-app/src-tauri/Cargo.toml --example verify -- . desktop-app/build/ubuntu-qa
      - name: Retain the experimental package and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ubuntu-amd64-${{ github.sha }}
          path: desktop-app/build/ubuntu/
          if-no-files-found: ignore
          retention-days: 30
