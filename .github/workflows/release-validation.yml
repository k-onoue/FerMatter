name: Release validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: rustup default stable
      - name: Install real compiler toolchains
        run: |
          brew install --cask mactex-no-gui
          brew install typst ghostscript
          echo /Library/TeX/texbin >> "$GITHUB_PATH"
      - name: Install the advisory auditor
        run: cargo install --locked cargo-audit --version 0.22.2 --root desktop-app/build/audit-tools
      - name: Require real compilers, tests, build and audits
        run: ./desktop-app/scripts/release-check.sh
        env:
          MATHLIDELUX_COMPILER_TESTS: "1"
          APPLE_SIGNING_IDENTITY: "-"
      - name: Retain evidence, including failed checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release-validation-${{ github.sha }}
          path: desktop-app/build/release-validation/
          if-no-files-found: error
          retention-days: 30
