name: Documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements-docs.txt
      - run: python -B -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: python scripts/build-guides.py --check
      - run: python -B scripts/check-publication.py
      - run: git diff --check HEAD^ HEAD
