[package]
name = "mathlidelux-desktop"
version = "0.10.0"
edition = "2021"
default-run = "mathlidelux-desktop"
rust-version = "1.92"
license = "Apache-2.0"

[lib]
name = "mathlidelux_core"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Native menu-bar sizing uses Tauri's minor-version-specific inner tray API.
tauri = { version = "~2.12", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
roxmltree = "0.20"
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
libc = "0.2"
zip = { version = "4", default-features = false, features = ["deflate"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = "0.45"
trash = "5"
lopdf = "0.42"
typstyle-core = "=0.15.1"
typst-syntax = "=0.15.1"
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "io-std", "macros", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSColorSpace", "NSColorSampler", "NSButton", "NSCell", "NSImage", "NSStatusBarButton", "NSStatusItem", "block2"] }
plist = "1"
url = "2"

[profile.release]
strip = true
lto = "thin"
