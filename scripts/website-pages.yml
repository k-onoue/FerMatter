# Installed in fermatter/fermatter.github.io as .github/workflows/pages.yml.
name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Stage public files
        run: |
          test -f index.html
          mkdir -p "$RUNNER_TEMP/website"
          rsync -a --exclude='/.git/' --exclude='/.github/' --exclude='/README.md' ./ "$RUNNER_TEMP/website/"
      - name: Stage the signed Ubuntu APT repository
        env:
          GH_TOKEN: ${{ github.token }}
          APT_REQUIRED: ${{ vars.FERMATTER_APT_AVAILABLE }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o "$RUNNER_TEMP/apt-release.json" -w '%{http_code}' \
            https://api.github.com/repos/FerMatter/fermatter.github.io/releases/tags/ubuntu-apt)"
          if [ "$status" = 404 ] && [ "$APT_REQUIRED" != true ]; then
            echo 'APT bootstrap has not been published yet.'
            exit 0
          fi
          test "$status" = 200
          gh release download ubuntu-apt --repo FerMatter/fermatter.github.io \
            --pattern apt-repository.tar.gz --dir "$RUNNER_TEMP/apt-download"
          python3 .github/scripts/stage-apt-repository.py \
            "$RUNNER_TEMP/apt-download/apt-repository.tar.gz" "$RUNNER_TEMP/website" \
            --fingerprint 8FB5E7A5ECB5E99601CD9C1BD049D613DE9DE3AF
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/website
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
