<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" role="img" aria-labelledby="title desc"><title id="title">Paper to slides</title><desc id="desc">Open LaTeX or Typst paper files in Library, optionally edit a presentation variant, and copy or drag SVG artwork to PowerPoint. Library variants leave the paper unchanged; Source mode edits its files.</desc><rect width="840" height="230" rx="12" fill="white"/><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#202020;text-anchor:middle;font-size:20px}.small{font-size:15px;fill:#626262}.box{fill:#fafafa;stroke:#d4d4d4;stroke-width:1.5}.arrow{fill:none;stroke:#555;stroke-width:1.5;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#555"/></marker></defs><rect class="box" x="18" y="40" width="176" height="100" rx="10"/><rect class="box" x="258" y="40" width="242" height="100" rx="10"/><rect class="box" x="664" y="40" width="158" height="100" rx="10"/><path class="arrow" d="M204 90H246"/><path class="arrow" d="M512 90H650"/><text x="106" y="79">Paper</text><text class="small" x="106" y="109">.tex / .typ</text><text x="379" y="79">Library</text><text class="small" x="379" y="109">Originals + variants</text><text x="743" y="96">PowerPoint</text><text class="small" x="582" y="70">SVG</text><text class="small" x="582" y="119">Copy / drag</text><text class="small" x="106" y="180">Source edits files</text><text class="small" x="379" y="180">Variants keep the paper unchanged</text></svg>
