<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" role="img" aria-labelledby="title desc"><title id="title">FerMatter MCP connection</title><desc id="desc">A local MCP client connects to FerMatter over stdio. FerMatter reads saved projects, invokes LaTeX or Typst, and exports images. The client receives file paths.</desc><rect width="840" height="280" rx="12" fill="white"/><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#202020;text-anchor:middle;font-size:20px}.small{font-size:15px;fill:#626262}.box{fill:#fafafa;stroke:#d4d4d4;stroke-width:1.5}.arrow{fill:none;stroke:#555;stroke-width:1.5;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#555"/></marker></defs><rect class="box" x="20" y="36" width="190" height="100" rx="10"/><rect class="box" x="324" y="36" width="192" height="100" rx="10"/><rect class="box" x="630" y="36" width="190" height="100" rx="10"/><path class="arrow" marker-start="url(#arrow)" d="M222 86H312"/><path class="arrow" marker-start="url(#arrow)" d="M528 86H618"/><path class="arrow" d="M420 148V190"/><rect class="box" x="252" y="202" width="336" height="55" rx="10"/><text x="115" y="78">MCP client</text><text class="small" x="115" y="106">Codex / Claude Code</text><text x="420" y="78">FerMatter</text><text class="small" x="420" y="106">Saved projects</text><text x="725" y="92">LaTeX / Typst</text><text class="small" x="267" y="58">stdio</text><text class="small" x="573" y="58">Render</text><text x="420" y="237">SVG · PDF · PNG · JPEG</text></svg>
